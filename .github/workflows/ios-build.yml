name: Build and Upload Hadi TV iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      BUNDLE_ID: com.dijlah.haditv
      TEAM_ID: 4VLY86MTP2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare signing files
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/hadi-tv-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")

          if [ "$PROFILE_TEAM" != "$TEAM_ID" ]; then
            echo "Provisioning Profile team does not match the configured Apple Developer team."
            exit 1
          fi

          case "$PROFILE_APP_ID" in
            "$TEAM_ID.$BUNDLE_ID"|"$TEAM_ID".*)
              ;;
            *)
              echo "Provisioning Profile application identifier does not match the expected bundle ID."
              exit 1
              ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "PROFILE_NAME<<EOF"
            echo "$PROFILE_NAME"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build Flutter iOS release
        run: flutter build ios --release --no-codesign

      - name: Archive signed iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HadiTV.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export signed IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "teamID": os.environ["TEAM_ID"],
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]
              },
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as f:
              plistlib.dump(options, f)
          PY

          mkdir -p "$GITHUB_WORKSPACE/build/ios/ipa"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HadiTV.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa"
          find "$GITHUB_WORKSPACE/build/ios/ipa" -maxdepth 1 -name '*.ipa' -print -quit | grep -q .

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HadiTV-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::App Store Connect credential preflight"
          # Never print secret values; only report presence and structural checks.
          for name in APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing GitHub secret::$name is empty or unavailable. Check Settings > Secrets and variables > Actions."
              exit 1
            fi
            echo "$name is present."
          done

          if ! [[ "$APP_STORE_CONNECT_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=Invalid API Key ID::APP_STORE_CONNECT_API_KEY_ID should be the 10-character Key ID from App Store Connect, not the Issuer ID or an email."
            exit 1
          fi

          if ! [[ "$APP_STORE_CONNECT_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$ ]]; then
            echo "::error title=Invalid Issuer ID::APP_STORE_CONNECT_ISSUER_ID must be the UUID Issuer ID from App Store Connect > Users and Access > Integrations > App Store Connect API."
            exit 1
          fi

          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"

          if ! printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$KEY_PATH" 2>"$RUNNER_TEMP/base64-error.log"; then
            echo "::error title=Invalid private-key Base64::APP_STORE_CONNECT_API_KEY_BASE64 could not be decoded. Recreate it from the original .p8 file."
            cat "$RUNNER_TEMP/base64-error.log"
            exit 1
          fi

          if ! grep -q -- 'BEGIN PRIVATE KEY' "$KEY_PATH" || ! grep -q -- 'END PRIVATE KEY' "$KEY_PATH"; then
            echo "::error title=Invalid .p8 file::Decoded key does not look like an Apple AuthKey private key. Ensure this Base64 secret belongs to Key ID $APP_STORE_CONNECT_API_KEY_ID."
            exit 1
          fi

          if ! openssl pkey -in "$KEY_PATH" -noout >/dev/null 2>"$RUNNER_TEMP/pkey-error.log"; then
            echo "::error title=Unreadable private key::OpenSSL could not parse the decoded .p8 file; the secret may be truncated or from another key."
            cat "$RUNNER_TEMP/pkey-error.log"
            exit 1
          fi

          IPA_PATH="$(find "$GITHUB_WORKSPACE/build/ios/ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error title=IPA missing::No .ipa file was found in build/ios/ipa."
            exit 1
          fi

          echo "Private-key format is valid; IPA file exists."
          echo "These checks validate format only, not Apple's recognition of the key or its permissions."
          echo "::endgroup::"

          echo "::group::Upload to App Store Connect (verbose diagnostics)"
          set +e
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose --output-format json 2>&1 | tee "$RUNNER_TEMP/altool-upload.log"
          ALTOOL_STATUS=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"

          if [ "$ALTOOL_STATUS" -ne 0 ]; then
            echo "::error title=App Store Connect upload failed::altool exited with code $ALTOOL_STATUS. Review the verbose output above."
            if grep -Eqi 'authentication|unauthorized|not authorized|invalid.*(key|issuer)|-26000|-1011|JWT' "$RUNNER_TEMP/altool-upload.log"; then
              echo "::error title=Authentication diagnosis::Apple rejected API authentication. Confirm Key ID, Issuer ID, and .p8 are from the same active API key; confirm its upload role and whether it is a Team or Individual key."
            elif grep -Eqi 'bundle identifier|bundle id|provisioning|signing|invalid.*bundle' "$RUNNER_TEMP/altool-upload.log"; then
              echo "::error title=App/signing diagnosis::Check bundle ID com.dijlah.haditv, its App Store Connect app record, and the distribution provisioning profile."
            elif grep -Eqi 'version|build number|duplicate' "$RUNNER_TEMP/altool-upload.log"; then
              echo "::error title=Version/build diagnosis::Apple may be rejecting a duplicate or invalid version/build number. Increment the iOS build number and retry."
            else
              echo "::error title=Unclassified upload failure::Read the detailed altool output above; the failure did not match common diagnostic patterns."
            fi
            exit "$ALTOOL_STATUS"
          fi

          echo "altool reported upload success. Apple may still need time to process the build."
